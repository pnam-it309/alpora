name: Feature request
description: Suggest an improvement to ALPORA
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
      description: Describe the current limitation and a concrete example.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behaviour
      description: Describe your idea, including how it should work with themes and reduced motion.

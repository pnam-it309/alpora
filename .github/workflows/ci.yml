name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Unit Tests & I18n Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon0 libxkbcommon-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow

      - name: Run I18n Key Parity Tests
        run: |
          python -m unittest tests/test_i18n.py

      - name: Run Multi-Monitor & Fractional Scaling Tests
        run: |
          python -m unittest tests/test_multimonitor.py

      - name: Run Desktop & Running Apps Tests
        run: |
          python -m unittest tests/test_desktop.py tests/test_running_apps.py tests/test_widgets.py

      - name: Run Full Test Suite
        run: |
          python -m unittest discover tests

<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poly World · Alpine — анимированное превью</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#122420;color:#edf1e7;font:16px system-ui,sans-serif;padding:24px;min-height:100vh}main{max-width:1400px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}h1{font-size:22px;margin:0}p{color:#b9cbc2;line-height:1.6}button{background:#263f37;color:inherit;border:1px solid #587467;border-radius:12px;padding:11px 18px;cursor:pointer;font:inherit}button[aria-pressed=true]{background:#b1cfb9;color:#122420}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.viewport{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:20px;border:1px solid #577064;background:#365451;isolation:isolate}.world{position:absolute;width:168.75%;height:100%;left:0;top:0;transform:translateX(var(--camera, -20.37037%));transition:transform 1.8s cubic-bezier(.22,.7,.16,1);will-change:transform}.base,.foreground,.clouds{position:absolute;width:100%;height:100%;object-fit:fill;pointer-events:none}.sky{position:absolute;inset:0;clip-path:inset(0 0 70% 0);pointer-events:none}.clouds{top:-10%;opacity:.65;animation:drift 35s ease-in-out infinite alternate}.foreground{transform-origin:bottom center;animation:breathe 12s ease-in-out infinite alternate}.bar{position:absolute;inset:12px 12px auto;background:#16332bc9;border:1px solid #a3c6ac55;border-radius:13px;padding:10px 16px;display:flex;justify-content:space-between;gap:10px;font-size:13px}.label{position:absolute;bottom:22px;left:24px;background:#153028c9;padding:12px 18px;border:1px solid #a3c6ac44;border-radius:14px}.paused *{animation-play-state:paused!important}.paused .world{transition:none}@keyframes drift{from{transform:translateX(-1%)}to{transform:translateX(2%)}}@keyframes breathe{from{transform:translateY(2px) scale(1.015)}to{transform:translateY(-2px) scale(1.025)}}@media(prefers-reduced-motion:reduce){.world{transition:none}.clouds,.foreground{animation:none}}@media(max-width:600px){body{padding:12px}header{align-items:flex-start}.bar{inset:6px 6px auto;padding:6px 10px}.label{bottom:10px;left:10px;padding:8px;font-size:12px}}
</style>
<main>
<header><h1>Poly World · Alpine</h1><button id="motion" aria-pressed="false">Пауза</button></header>
<div class="viewport" id="scene" role="img" aria-label="Живой альпийский пейзаж: озеро, лес с хижиной и каменистый склон">
<div class="world" id="world"><img class="base" src="panorama.png" alt=""><div class="sky"><img class="clouds" src="clouds.png" alt=""></div><img class="foreground" src="foreground.png" alt=""></div>
<div class="bar"><span>POLY · WORLD</span><span>Alpine · превью сцены</span><span>01 / 02 / 03</span></div>
<div class="label" id="location">02 · Лес</div>
</div>
<nav class="controls" aria-label="Ракурс"><button data-camera="0%" aria-pressed="false">01 · Озеро</button><button data-camera="-20.37037%" aria-pressed="true">02 · Лес</button><button data-camera="-40.74074%" aria-pressed="false">03 · Склон</button></nav>
<p>Облака движутся, передний план мягко смещается; кнопки перемещают камеру по общей панораме. Это локальный эскиз движения. Рябь воды, дым и связь с рабочими столами Hyprland ещё не подключены.</p>
</main>
<script>
const scene=document.querySelector('#scene'),world=document.querySelector('#world'),motion=document.querySelector('#motion');let paused=false;
document.querySelectorAll('[data-camera]').forEach(button=>button.addEventListener('click',()=>{world.style.setProperty('--camera',button.dataset.camera);document.querySelectorAll('[data-camera]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));document.querySelector('#location').textContent=button.textContent}));
function syncMotion(){scene.classList.toggle('paused',paused||document.hidden)}
motion.addEventListener('click',()=>{paused=!paused;motion.textContent=paused?'Продолжить':'Пауза';motion.setAttribute('aria-pressed',String(paused));syncMotion()});document.addEventListener('visibilitychange',syncMotion);
</script>
</html>

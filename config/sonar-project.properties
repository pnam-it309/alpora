# SonarQube / SonarScanner Configuration
sonar.projectKey=pnam-it309_alpora
sonar.organization=pnam-it309

# Source and Test scopes
sonar.sources=poly_shell,scripts,shell,dotfiles
sonar.tests=tests

# Target Python runtime versions
sonar.python.version=3.10, 3.11, 3.12, 3.13

# Exclude GTK CSS theme templates and performance audit traces from web analysis.
sonar.exclusions=assets/theme-templates/**,docs/audits/traces/**

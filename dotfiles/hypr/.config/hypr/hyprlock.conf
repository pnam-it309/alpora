# ALPORA managed lockscreen configuration
# Theme dynamic colors and geometry
$font = Noto Sans

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    fade_on_empty = false
    font_color = rgb(237, 242, 244)
    inner_color = rgba(24, 31, 39, 0.75)
    outer_color = rgba(168, 213, 188, 0.85)
    check_color = rgb(168, 213, 188)
    fail_color = rgb(241, 139, 130)
    placeholder_text = <i>Input Password...</i>
    hide_input = false
    position = 0, -80
    halign = center
    valign = center
}

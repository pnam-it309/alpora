[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alpora"
version = "1.2.0"
description = "Fast, coherent, multi-theme desktop environment and QuickShell companion for Hyprland"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "ALPORA Team" }
]
keywords = ["desktop", "hyprland", "quickshell", "wayland", "linux"]
dependencies = [
    "pillow>=10.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "yamllint>=1.35.0",
]

[project.scripts]
poly-shell = "poly_shell.cli:main"
alpora = "poly_shell.cli:main"
